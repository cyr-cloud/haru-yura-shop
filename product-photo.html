  <!-- 로그인했는지 확인이 끝날 때까지, 그리고 로그인하지 않았을 때 이 줄만 보입니다 -->
  <p class="lead" id="photo-checking">로그인했는지 확인하고 있습니다.</p>

  <!-- 로그인한 사람일 때만 hidden 이 풀립니다 -->
  <form class="pay" id="photo-form" hidden>
    <label for="photo-product">상품</label>
    <select id="photo-product" required disabled>
      <option value="">상품을 불러오는 중입니다</option>
    </select>

    <label for="photo-file">사진 파일</label>
    <input id="photo-file" type="file" accept="image/*" required>

    <button class="btn" type="submit" id="btn-photo" disabled>사진 올리기</button>
    <p id="photo-msg" role="status" aria-live="polite"></p>
  </form>
</div></main>
