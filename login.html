<header class="site"><div class="wrap">
  <a class="brand" href="index.html">유라문구</a>
  <nav class="site">
    <a href="index.html">문구</a>
    <a href="about.html">가게 이야기</a>
    <a href="shipping.html">배송과 교환</a>
    <a href="cart.html">장바구니<span class="cart-count">0</span></a>
    <span class="auth-nav" id="auth-nav" hidden></span>
  </nav>
</div></header>

<main><div class="wrap">
  <h2>로그인</h2>
  <p class="lead">수업에서 쓰는 연습용 화면입니다. 이메일과 비밀번호로 가입하고, 들어오고, 나갑니다.</p>

  <form class="pay" id="auth-form">
    <label for="email">이메일</label>
    <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">

    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="여섯 글자 이상">

    <button class="btn" type="button" id="btn-signup">가입</button>
    <button class="btn" type="button" id="btn-login">로그인</button>
    <button class="btn ghost" type="button" id="btn-logout">로그아웃</button>
  </form>

  <!-- 결과를 한 줄로 보여 주는 자리 -->
  <p id="auth-msg" role="status" aria-live="polite"></p>
  <p id="auth-state" class="lead"></p>
</div></main>

<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script type="module" src="assets/auth.js"></script>

<script type="module">
  // 로그인했는지 묻는 자리(onAuthStateChanged)는 assets/auth.js 한 곳뿐입니다.
  // 이 화면은 거기서 만들어 둔 auth 와 그 결과만 받아 씁니다.
  import {
    auth,
    onUser,
    nextTarget,
    sendVerifyMail,
    mailErrorLine,
    setFlash
  } from "./assets/auth.js";
  import {
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const emailBox = document.querySelector("#email");
  const passwordBox = document.querySelector("#password");
  const msg = document.querySelector("#auth-msg");
  const stateLine = document.querySelector("#auth-state");

  // 로그인하지 않아 여기로 돌려보내졌다면, 가려던 화면 이름이 주소의 ?next= 에 붙어 있습니다
  const next = nextTarget();

  // 가입 처리 중인지. 인증 메일을 다 보낸 뒤에 우리가 직접 화면을 옮기므로,
  // 그때까지는 아래 onUser 의 자동 이동이 끼어들지 않게 막아 둡니다.
  let signingUp = false;

  // 한 줄만 보여 줍니다 - 잘 됐으면 무엇이 됐는지, 안 됐으면 오류 코드 글자 그대로
  function say(text) {
    msg.textContent = text;
  }

  // 오류 상자에서 auth/ 로 시작하는 코드를 그대로 꺼내 보여 줍니다
  function sayError(error) {
    say(error && error.code ? error.code : String(error));
  }

  if (next) say("로그인하시면 " + next + " 으로 다시 보내 드립니다");

  document.querySelector("#btn-signup").addEventListener("click", async () => {
    say("가입하는 중입니다");
    signingUp = true;
    try {
      const cred = await createUserWithEmailAndPassword(auth, emailBox.value, passwordBox.value);
      passwordBox.value = "";

      // 가입한 주소로 인증 메일을 바로 보냅니다. 보내기가 끝날 때까지 기다립니다.
      say("인증 메일을 보내는 중입니다");
      await sendVerifyMail(cred.user);

      // 넘어간 화면에서 보여 줄 한 줄을 적어 두고, 그제야 화면을 옮깁니다
      setFlash("인증 메일을 보냈습니다. 메일함과 스팸함을 확인해 주세요.");
      location.replace(next || "mypage.html");
    } catch (error) {
      // 가입이나 메일 보내기가 안 됐으면 이 화면에 그대로 머무릅니다
      signingUp = false;
      say(mailErrorLine(error));
    }
  });

  document.querySelector("#btn-login").addEventListener("click", async () => {
    say("들어가는 중입니다");
    try {
      const cred = await signInWithEmailAndPassword(auth, emailBox.value, passwordBox.value);
      say("로그인됐습니다: " + cred.user.email);
      passwordBox.value = "";
    } catch (error) {
      sayError(error);
    }
  });

  document.querySelector("#btn-logout").addEventListener("click", async () => {
    say("나가는 중입니다");
    try {
      await signOut(auth);
      say("로그아웃됐습니다");
      passwordBox.value = "";
    } catch (error) {
      sayError(error);
    }
  });

  // 지금 들어와 있는지 아닌지를 적어 둡니다 - 결과는 auth.js 가 알려 줍니다
  onUser(user => {
    stateLine.textContent = user ? "지금 들어와 있는 계정: " + user.email : "지금은 들어와 있지 않습니다";
    // 들어왔고 원래 가려던 화면이 있으면 그리로 다시 보냅니다
    // (가입 처리 중에는 메일을 다 보낸 뒤에 가입 쪽에서 직접 옮깁니다)
    if (user && next && !signingUp) location.replace(next);
  });
</script>
</body>
</html>
