<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리 화면 — 유라문구</title>
<meta name="description" content="가게를 관리하는 사람만 들어오는 화면의 입구입니다">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* 관리 화면에서만 - 「새 상품」 과 필터 줄 사이를 띄우고, 필터 버튼은 켜도 꺼도 같은 크기로 */
  #btn-new{margin:0 0 20px}
  #products-tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin:0 0 16px}
  #products-tools [role=group]{display:flex;gap:8px}
  #products-tools .btn{padding:9px 16px;font-size:13px;border:1px solid var(--accent)}
  #products-tools .btn.ghost{border-color:var(--line)}
  /* 내리기 뒤에 화면 아래에 뜨는 한 줄 안내 */
  #undo-bar{position:fixed;left:16px;right:16px;bottom:16px;z-index:10;display:flex;flex-wrap:wrap;
    align-items:center;gap:8px 16px;padding:12px 16px;background:var(--card);border:1px solid var(--line);
    box-shadow:0 4px 16px rgba(0,0,0,.12)}
  #undo-bar[hidden]{display:none}
  #undo-bar p{margin:0}
  #undo-bar pre{margin:0;flex-basis:100%;white-space:pre-wrap}
  #remove-dialog .btn{margin:0 8px 0 0}
  #activity{margin:48px 0 96px}
  /* 상품 · 주문 탭 */
  #admin-tabs{display:flex;gap:8px;margin:24px 0}
  #admin-tabs[hidden]{display:none}
  #admin-tabs .btn{padding:9px 16px;font-size:13px;border:1px solid var(--accent)}
  #admin-tabs .btn.ghost{border-color:var(--line)}
  #orders-tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin:0 0 16px}
  #orders-table tr[data-id]{cursor:pointer}
  #order-detail dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0 0 16px}
  #order-detail dd{margin:0;white-space:pre-wrap}
  #btn-orders-more{margin:16px 0 96px}
  #status-dialog .btn{margin:0 8px 0 0}
  /* 매출 탭 */
  #sales-chart-box{position:relative;height:320px;margin:0 0 24px}
  #sales-panel{margin:0 0 96px}
</style>

<!-- 동의 배너 - 태그 관리자보다 먼저 읽혀야 합니다 -->

<!-- 가게 머리글 · 메뉴는 넣지 않습니다. 주소를 직접 넣어서 여는 화면입니다. -->
<main><div class="wrap">
  <h2>관리 화면</h2>

  <!-- 로그인했는지 확인이 끝날 때까지는 이 줄만 보입니다 -->
  <p class="lead" id="checking">로그인했는지 확인하고 있습니다.</p>

  <!-- 로그인하지 않은 사람에게는 이 한 줄과 링크만 보입니다 -->
  <div id="need-login" hidden>
    <p class="lead">로그인이 필요합니다</p>
    <a href="/login.html">로그인 화면으로</a>
  </div>

  <!-- 토큰의 role 이 staff 또는 admin 일 때 -->
  <p class="lead" id="is-admin" hidden></p>

  <!-- 그 밖일 때 -->
  <div id="no-role" hidden>
    <p class="lead">권한이 없습니다</p>
    <button class="btn" type="button" id="btn-grant">주인 명찰 받기</button>
  </div>

  <!-- 결과나 오류를 보여 주는 자리 -->
  <p id="admin-msg" role="status" aria-live="polite"></p>
  <div id="admin-error"></div>

  <button class="btn ghost" type="button" id="btn-recheck">다시 확인</button>

  <!-- 상품 · 주문 탭 - 관리자일 때만 보입니다 -->
  <div id="admin-tabs" role="group" aria-label="탭" hidden>
    <button class="btn" type="button" data-tab="products" aria-pressed="true">상품</button>
    <button class="btn ghost" type="button" data-tab="orders" aria-pressed="false">주문</button>
    <button class="btn ghost" type="button" data-tab="sales" aria-pressed="false">매출</button>
  </div>

  <!-- 상품 표 - 입구가 「관리자: staff」 또는 「관리자: admin」 일 때만 hidden 이 풀립니다 -->
  <section id="products-panel" hidden>
    <h2>상품</h2>

    <button class="btn" type="button" id="btn-new">새 상품</button>

    <!-- 「새 상품」 을 누르면 열립니다 -->
    <form class="pay" id="new-form" hidden>
      <label for="new-name">name</label>
      <input id="new-name" type="text" required>
      <label for="new-price">price</label>
      <input id="new-price" type="number" step="any" required>
      <label for="new-summary">summary</label>
      <input id="new-summary" type="text">
      <label for="new-stock">stock</label>
      <input id="new-stock" type="number" step="1" min="0" required>
      <label for="new-photo">사진</label>
      <input id="new-photo" type="file" accept="image/*">
      <button class="btn" type="submit">저장</button>
      <button class="btn ghost" type="button" id="btn-new-close">닫기</button>
    </form>
    <div id="new-result"></div>

    <!-- 필터 · 검색 · 정렬 - 한 번 읽어 둔 상품에서 화면이 고릅니다 (Firestore 에 다시 묻지 않습니다) -->
    <div id="products-tools">
      <div role="group" aria-label="필터">
        <button class="btn" type="button" data-filter="all" aria-pressed="true">전체</button>
        <button class="btn ghost" type="button" data-filter="soldout" aria-pressed="false">품절만</button>
        <button class="btn ghost" type="button" data-filter="hidden" aria-pressed="false">숨김만</button>
        <button class="btn ghost" type="button" data-filter="deleted" aria-pressed="false">내린 상품</button>
      </div>
      <label for="products-search">이름 검색</label>
      <input id="products-search" type="search" placeholder="이름에 든 글자">
      <label for="products-sort">정렬</label>
      <select id="products-sort">
        <option value="stock">재고 적은 순</option>
        <option value="name">이름순</option>
      </select>
    </div>

    <p id="products-msg" role="status" aria-live="polite"></p>
    <div id="products-table"></div>

    <!-- 최근 활동 - 함수가 남기는 adminLogs 를 읽기만 합니다 (이 화면은 adminLogs 에 쓰지 않습니다) -->
    <section id="activity">
      <h2>최근 활동</h2>
      <button class="btn ghost" type="button" id="btn-activity">새로 읽기</button>
      <div id="activity-box"></div>
    </section>

    <!-- 내리기 확인 창 -->
    <dialog id="remove-dialog">
      <form method="dialog">
        <p id="remove-text"></p>
        <button class="btn" value="remove">내리기</button>
        <button class="btn ghost" value="cancel">그만두기</button>
      </form>
    </dialog>

    <!-- 내리기 뒤에 화면 아래에 뜨는 한 줄 안내 -->
    <div id="undo-bar" role="status" aria-live="polite" hidden></div>
  </section>

  <!-- 주문 - 「주문」 탭을 누르면 보입니다. 취소 버튼은 두지 않습니다 (환불은 포트원, 상태는 웹훅이 바꿉니다) -->
  <section id="orders-panel" hidden>
    <h2>주문</h2>

    <!-- 상태를 고르면 처음부터 그 상태 주문만 Firestore 에서 읽어 옵니다 -->
    <div id="orders-tools">
      <label for="orders-status">상태</label>
      <select id="orders-status">
        <option value="all">전체</option>
        <option value="paid">paid</option>
        <option value="preparing">preparing</option>
        <option value="shipped">shipped</option>
        <option value="delivered">delivered</option>
        <option value="canceled">canceled</option>
      </select>
    </div>

    <!-- 줄을 누르면 여기에 상세가 보입니다 -->
    <div id="order-detail"></div>

    <p id="orders-msg" role="status" aria-live="polite"></p>
    <div id="orders-table"></div>
    <button class="btn ghost" type="button" id="btn-orders-more" hidden>더 보기</button>

    <!-- 상태 바꾸기 확인 창 -->
    <dialog id="status-dialog">
      <form method="dialog">
        <p id="status-text"></p>
        <button class="btn" value="change">바꾸기</button>
        <button class="btn ghost" value="cancel">그만두기</button>
      </form>
    </dialog>
  </section>

  <!-- 매출 - 「매출」 탭을 누르면 보입니다. 함수가 매일 적는 dailyStats 만 읽습니다 (orders 는 읽지 않습니다) -->
  <section id="sales-panel" hidden>
    <h2>매출</h2>
    <p id="sales-lead"></p>
    <p id="sales-counted"></p>
    <div id="sales-msg" role="status" aria-live="polite"></div>
    <div id="sales-chart-box"><canvas id="sales-chart" aria-label="최근 7일 매출 막대 차트" role="img"></canvas></div>
    <div id="sales-table"></div>
  </section>
</div></main>

<!-- 매출 막대 차트 - Chart.js 를 버전을 고정한 주소로 불러옵니다 (폴더에 설치하지 않습니다) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<!-- 로그인 상태를 묻는 자리는 assets/auth.js 한 곳뿐입니다. 여기서는 결과만 받아 씁니다. -->
<script type="module">
  import { auth, onUser } from "./assets/auth.js";
  import { getApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js";
  import {
    getFirestore,
    collection,
    doc,
    getDocsFromServer,
    getDocFromServer,
    addDoc,
    updateDoc,
    serverTimestamp,
    deleteField,
    query,
    orderBy,
    limit,
    where,
    startAfter
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  import {
    getStorage,
    ref as storageRef,
    uploadBytesResumable,
    getDownloadURL
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";

  // Firebase 연결은 auth.js 가 이미 넣어 둔 값(12.19.0)으로 해 둡니다. 여기서는 그것을 받아 씁니다.
  // 함수 지역은 us-central1 로 맞춥니다. 로그인 정보는 SDK 가 저절로 실어 보냅니다.
  const grantOwnerRole = httpsCallable(getFunctions(getApp(), "us-central1"), "grantOwnerRole");

  const checking = document.querySelector("#checking");
  const needLogin = document.querySelector("#need-login");
  const isAdmin = document.querySelector("#is-admin");
  const noRole = document.querySelector("#no-role");
  const msg = document.querySelector("#admin-msg");
  const errorBox = document.querySelector("#admin-error");
  const grantBtn = document.querySelector("#btn-grant");
  const recheckBtn = document.querySelector("#btn-recheck");

  const productsPanel = document.querySelector("#products-panel");
  const ordersPanel = document.querySelector("#orders-panel");
  const salesPanel = document.querySelector("#sales-panel");
  const adminTabs = document.querySelector("#admin-tabs");

  // 지금 보고 있는 탭 - "products" 또는 "orders"
  let currentTab = "products";
  // 주문은 「주문」 탭을 처음 열 때 읽습니다
  let ordersLoaded = false;
  // 매출도 「매출」 탭을 처음 열 때 읽습니다
  let salesLoaded = false;

  // 판단을 여러 번 불렀을 때 마지막 것만 화면에 그리기 위한 번호
  let turn = 0;

  // 오류 글은 줄이지 않고 그대로 보여 줍니다 (code 와 message 를 모두)
  function showError(error, box = errorBox) {
    console.error(error);
    const pre = document.createElement("pre");
    pre.className = "rules-error";
    const code = error && error.code ? error.code : "";
    const message = error && error.message ? error.message : String(error);
    // Storage 오류는 서버가 돌려준 글이 따로 붙어 올 때가 있어, 있으면 그것도 그대로 붙입니다
    const server = error && error.customData && error.customData.serverResponse;
    pre.textContent = (code ? code + "\n" : "") + message +
      (server && !message.includes(server) ? "\n" + server : "");
    box.replaceChildren(pre);
  }

  function hideAll() {
    checking.hidden = true;
    needLogin.hidden = true;
    isAdmin.hidden = true;
    noRole.hidden = true;
    productsPanel.hidden = true;
    ordersPanel.hidden = true;
    salesPanel.hidden = true;
    adminTabs.hidden = true;
  }

  // 탭 하나만 보이게 하고, 그 탭 버튼만 켜 둡니다
  function showTab(name) {
    currentTab = name;
    productsPanel.hidden = name !== "products";
    ordersPanel.hidden = name !== "orders";
    salesPanel.hidden = name !== "sales";
    adminTabs.querySelectorAll("[data-tab]").forEach(b => {
      const on = b.dataset.tab === name;
      b.setAttribute("aria-pressed", String(on));
      b.className = on ? "btn" : "btn ghost";
    });
    if (name === "orders" && !ordersLoaded) {
      ordersLoaded = true;
      loadOrders(true);
    }
    if (name === "sales" && !salesLoaded) {
      salesLoaded = true;
      loadSales();
    }
  }

  adminTabs.querySelectorAll("[data-tab]").forEach(btn => {
    btn.addEventListener("click", () => showTab(btn.dataset.tab));
  });

  /**
   * 로그인 토큰의 커스텀 클레임 role 로만 판단합니다 (Firestore users 문서는 보지 않습니다).
   * refresh 가 true 면 토큰을 서버에서 새로 받아 옵니다 - 다시 로그인하지 않아도 됩니다.
   */
  async function judge(user, refresh) {
    const mine = ++turn;
    if (!user) {
      hideAll();
      needLogin.hidden = false;
      return;
    }
    const result = await user.getIdTokenResult(refresh);
    if (mine !== turn) return;
    const role = result.claims.role;
    hideAll();
    if (role === "staff" || role === "admin") {
      isAdmin.textContent = "관리자: " + role;
      isAdmin.hidden = false;
      adminTabs.hidden = false;
      showTab(currentTab);
      // 최근 활동의 상품 이름은 읽어 둔 상품에서 찾으므로, 상품을 읽은 뒤에 읽습니다
      paintTable().then(paintActivity);
    } else {
      noRole.hidden = false;
    }
  }

  // 로그인 상태가 확인되면 한 번, 그 뒤 바뀔 때마다 다시 불립니다
  onUser(user => {
    judge(user, false).catch(showError);
  });

  // 주인 명찰 받기 - 성공하면 토큰을 새로 받아 다시 판단합니다
  grantBtn.addEventListener("click", async () => {
    grantBtn.disabled = true;
    msg.textContent = "명찰을 받는 중입니다";
    errorBox.replaceChildren();
    try {
      await grantOwnerRole();
      msg.textContent = "명찰을 받았습니다. 토큰을 새로 받는 중입니다";
      await judge(auth.currentUser, true);
      msg.textContent = "";
    } catch (error) {
      msg.textContent = "";
      showError(error);
    }
    grantBtn.disabled = false;
  });

  // 다시 확인 - 토큰을 새로 받아 다시 판단합니다
  recheckBtn.addEventListener("click", async () => {
    recheckBtn.disabled = true;
    msg.textContent = "";
    errorBox.replaceChildren();
    try {
      await judge(auth.currentUser, true);
    } catch (error) {
      showError(error);
    }
    recheckBtn.disabled = false;
  });

  /* ===========================================================
     상품 표 - 관리자일 때만 보입니다.
     규칙이 막는 일은 화면에서 미리 막지 않고, 저장이 실패하면 오류 글을 그대로 보여 줍니다.
     =========================================================== */
  const db = getFirestore(getApp());
  const productsCol = collection(db, "products");
  const productsMsg = document.querySelector("#products-msg");
  const tableBox = document.querySelector("#products-table");

  // 입력 칸의 글자를 숫자로 바꿉니다 - 숫자가 아니면 null
  function toNumber(text) {
    if (String(text).trim() === "") return null;
    const n = Number(text);
    return Number.isFinite(n) ? n : null;
  }

  // 0 이상 정수인지
  function isStockNumber(n) {
    return Number.isInteger(n) && n >= 0;
  }

  /* --- 사진 - 버킷은 Firebase 설정의 storageBucket 값 그대로 씁니다 --- */
  const storage = getStorage(getApp());

  // 올릴 자리 - 맨 앞에 / 를 붙이지 않습니다. 예: products/p1/main.jpg
  const photoPath = id => "products/" + id + "/main.jpg";

  // 올리기 전에 고른 파일을 봅니다 - 괜찮으면 null, 안 되면 보여 줄 한 줄
  function photoProblem(file) {
    if (file.size >= 5 * 1024 * 1024) return "5MB 넘는 사진은 올릴 수 없습니다";
    if (!file.type.startsWith("image/")) return "이미지 파일만 올릴 수 있습니다";
    return null;
  }

  // 고른 파일을 줄이거나 바꾸지 않고 그대로 올립니다. 올라가는 동안 몇 % 인지 box 에 보여 줍니다
  function uploadPhoto(id, file, box) {
    const task = uploadBytesResumable(storageRef(storage, photoPath(id)), file);
    return new Promise((resolve, reject) => {
      task.on("state_changed", s => {
        const pct = s.totalBytes ? Math.floor((s.bytesTransferred / s.totalBytes) * 100) : 0;
        showOk(box, "올리는 중 " + pct + "%");
      }, reject, () => resolve(task.snapshot));
    });
  }

  // 표의 작은 사진 - 문서에는 경로만 있으므로, 보여 줄 때만 주소를 받아 옵니다
  async function paintThumb(cell, imagePath) {
    cell.replaceChildren();
    if (!imagePath) return;
    try {
      const img = document.createElement("img");
      img.src = await getDownloadURL(storageRef(storage, imagePath));
      img.alt = "";
      img.width = 48;
      img.height = 48;
      img.style.objectFit = "cover";
      cell.replaceChildren(img);
    } catch (error) {
      showError(error, cell);
    }
  }

  function showOk(box, text) {
    const p = document.createElement("p");
    p.className = "rules-ok";
    p.textContent = text;
    box.replaceChildren(p);
  }

  // products 를 조건 없이 전부 읽어 표로 그립니다 (숨긴 상품도 모두)
  // 한 번 읽어 둔 상품 전부 - { id, data } 의 목록. 필터 · 검색 · 정렬은 여기서 고릅니다
  let allProducts = [];

  // 지금 고른 필터 · 검색 · 정렬
  const view = { filter: "all", search: "", sort: "stock" };

  // products 를 조건 없이 한 번 읽어 둡니다 (골라 읽기 · 정렬해 읽기 · 개수 제한 없음)
  async function paintTable() {
    productsMsg.textContent = "상품을 읽는 중입니다";
    try {
      const snap = await getDocsFromServer(productsCol);
      allProducts = snap.docs.map(d => ({ id: d.id, data: d.data() }));
      renderTable();
    } catch (error) {
      productsMsg.textContent = "";
      showError(error, tableBox);
    }
  }

  // 읽어 둔 것에서 필터 · 검색 · 정렬을 겹쳐 적용해 표를 다시 그립니다 - Firestore 에 묻지 않습니다
  function renderTable() {
    const word = view.search.trim().toLowerCase();
    const shown = allProducts.filter(({ data }) => {
      if (view.filter === "soldout" && data.stock !== 0) return false;
      if (view.filter === "hidden" && data.isVisible !== false) return false;
      if (view.filter === "deleted" && data.deletedAt == null) return false;
      // 영어는 대소문자를 가리지 않습니다
      if (word && !String(data.name ?? "").toLowerCase().includes(word)) return false;
      return true;
    });

    if (view.sort === "stock") {
      // 재고 적은 순 - 재고가 숫자가 아닌 상품은 맨 뒤로
      const stockOf = d => (typeof d.stock === "number" ? d.stock : Infinity);
      shown.sort((a, b) => stockOf(a.data) - stockOf(b.data));
    } else {
      shown.sort((a, b) => String(a.data.name ?? "").localeCompare(String(b.data.name ?? ""), "ko"));
    }

    const table = document.createElement("table");
    table.className = "cart";
    const head = table.insertRow();
    ["문서 ID", "사진", "name", "price", "stock", "품절", "노출", "", "", "결과"].forEach(text => {
      const th = document.createElement("th");
      th.textContent = text;
      head.append(th);
    });
    shown.forEach(({ id, data }) => addRow(table, id, data));
    productsMsg.textContent = "지금 보이는 상품 " + shown.length + "개 / 전체 " + allProducts.length + "개";
    tableBox.replaceChildren(table);
  }

  // 필터 버튼 셋 - 누른 것만 켜 둡니다
  const filterBtns = document.querySelectorAll("#products-tools [data-filter]");
  filterBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      view.filter = btn.dataset.filter;
      filterBtns.forEach(b => {
        const on = b === btn;
        b.setAttribute("aria-pressed", String(on));
        b.className = on ? "btn" : "btn ghost";
      });
      renderTable();
    });
  });

  document.querySelector("#products-search").addEventListener("input", event => {
    view.search = event.target.value;
    renderTable();
  });

  document.querySelector("#products-sort").addEventListener("change", event => {
    view.sort = event.target.value;
    renderTable();
  });

  /* --- 내리기 · 되돌리기 - 상품 문서를 진짜로 지우지 않고 deletedAt 과 isVisible 만 바꿉니다 --- */
  const removeDialog = document.querySelector("#remove-dialog");
  const undoBar = document.querySelector("#undo-bar");

  // 확인 창을 띄우고, 누른 버튼 값("remove" 또는 "cancel")을 돌려줍니다. Esc 로 닫으면 "" 입니다
  function askRemove(name) {
    document.querySelector("#remove-text").textContent = "『" + name + "』을 가게에서 내립니다";
    removeDialog.returnValue = "";
    removeDialog.showModal();
    return new Promise(resolve => {
      removeDialog.addEventListener("close", () => resolve(removeDialog.returnValue), { once: true });
    });
  }

  // 되돌리기 - deletedAt 필드를 아예 지우고 isVisible 을 true 로
  async function restoreProduct(id, data) {
    await updateDoc(doc(db, "products", id), { deletedAt: deleteField(), isVisible: true });
    delete data.deletedAt;
    data.isVisible = true;
  }

  // 화면 아래 한 줄 안내. target 이 있으면 「되돌리기」 버튼을 함께 둡니다
  function showUndoBar(text, target) {
    const line = document.createElement("p");
    line.textContent = text;
    undoBar.replaceChildren(line);
    if (target) {
      const undoBtn = document.createElement("button");
      undoBtn.type = "button";
      undoBtn.className = "btn ghost";
      undoBtn.textContent = "되돌리기";
      undoBtn.addEventListener("click", async () => {
        undoBtn.disabled = true;
        try {
          await restoreProduct(target.id, target.data);
          showUndoBar("『" + String(target.data.name ?? "") + "』을 가게에 되돌렸습니다", null);
          renderTable();
        } catch (error) {
          undoBtn.disabled = false;
          const box = document.createElement("div");
          undoBar.append(box);
          showError(error, box);
        }
      });
      undoBar.append(undoBtn);
    }
    const closeBtn = document.createElement("button");
    closeBtn.type = "button";
    closeBtn.className = "btn ghost";
    closeBtn.textContent = "닫기";
    closeBtn.addEventListener("click", () => { undoBar.hidden = true; });
    undoBar.append(closeBtn);
    undoBar.hidden = false;
  }

  /* --- 최근 활동 - adminLogs 를 at 이 최신인 것부터 열 줄 읽습니다 (읽기만 합니다) --- */
  const activityBox = document.querySelector("#activity-box");

  async function paintActivity() {
    activityBox.replaceChildren();
    try {
      const snap = await getDocsFromServer(query(collection(db, "adminLogs"), orderBy("at", "desc"), limit(10)));
      // 상품 이름은 한 번 읽어 둔 상품에서 productId 로 찾습니다
      const names = new Map(allProducts.map(({ id, data }) => [id, data.name]));
      const table = document.createElement("table");
      table.className = "cart";
      const head = table.insertRow();
      ["시각", "상품 이름", "action", "changedKeys"].forEach(text => {
        const th = document.createElement("th");
        th.textContent = text;
        head.append(th);
      });
      snap.forEach(d => {
        const log = d.data();
        const row = table.insertRow();
        const at = log.at && typeof log.at.toDate === "function" ? log.at.toDate().toLocaleString("ko-KR") : "";
        const name = names.has(log.productId) ? String(names.get(log.productId) ?? "") : "(찾지 못함: " + String(log.productId ?? "") + ")";
        const keys = Array.isArray(log.changedKeys) ? log.changedKeys.join(", ") : String(log.changedKeys ?? "");
        // Firestore 에서 온 값은 글자로만 넣습니다
        [at, name, String(log.action ?? ""), keys].forEach(text => {
          row.insertCell().textContent = text;
        });
      });
      if (snap.empty) {
        showOk(activityBox, "아직 활동이 없습니다");
      } else {
        activityBox.replaceChildren(table);
      }
    } catch (error) {
      showError(error, activityBox);
    }
  }

  document.querySelector("#btn-activity").addEventListener("click", paintActivity);

  // 상품 한 줄. Firestore 에서 온 값은 글자로만 넣습니다
  function addRow(table, id, data) {
    const row = table.insertRow();
    row.insertCell().textContent = id;
    const thumbCell = row.insertCell();
    paintThumb(thumbCell, data.imagePath);
    row.insertCell().textContent = String(data.name ?? "");
    const priceCell = row.insertCell();
    priceCell.textContent = String(data.price ?? "");
    const stockCell = row.insertCell();
    stockCell.textContent = String(data.stock ?? "");

    const soldOut = document.createElement("input");
    soldOut.type = "checkbox";
    soldOut.checked = data.stock === 0;
    soldOut.setAttribute("aria-label", id + " 품절");
    row.insertCell().append(soldOut);

    const visible = document.createElement("input");
    visible.type = "checkbox";
    visible.checked = data.isVisible === true;
    visible.setAttribute("aria-label", id + " 노출");
    row.insertCell().append(visible);

    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "btn ghost";
    editBtn.textContent = "고치기";
    row.insertCell().append(editBtn);

    // 내리기 - 「내린 상품」 필터에서는 그 자리에 「되돌리기」 를 둡니다
    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "btn ghost";
    removeBtn.textContent = view.filter === "deleted" ? "되돌리기" : "내리기";
    row.insertCell().append(removeBtn);

    // 저장 결과나 오류를 그 줄 옆에 보여 주는 칸
    const result = row.insertCell();

    const ref = doc(db, "products", id);

    removeBtn.addEventListener("click", async () => {
      if (view.filter === "deleted") {
        removeBtn.disabled = true;
        try {
          await restoreProduct(id, data);
          showUndoBar("『" + String(data.name ?? "") + "』을 가게에 되돌렸습니다", null);
          renderTable();
        } catch (error) {
          showError(error, result);
          removeBtn.disabled = false;
        }
        return;
      }

      const answer = await askRemove(String(data.name ?? ""));
      if (answer !== "remove") return;
      removeBtn.disabled = true;
      try {
        // deletedAt 은 내 컴퓨터 시각이 아니라 서버 시각으로 적습니다. 문서는 지우지 않습니다
        await updateDoc(ref, { deletedAt: serverTimestamp(), isVisible: false });
        // 화면이 가진 값도 맞춰 둡니다 (서버 시각 값은 다음에 읽을 때 들어옵니다)
        data.deletedAt = true;
        data.isVisible = false;
        visible.checked = false;
        showOk(result, "내렸습니다");
        showUndoBar("『" + String(data.name ?? "") + "』을 가게에서 내렸습니다", { id, data });
      } catch (error) {
        showError(error, result);
      }
      removeBtn.disabled = false;
    });

    // 품절 토글 - 켜면 stock 을 0 으로, 끄면 재고 숫자를 물어 그 숫자(1 이상 정수)로
    soldOut.addEventListener("change", async () => {
      const turnOn = soldOut.checked;
      let stock = 0;
      if (!turnOn) {
        const answer = prompt(id + " 의 재고 숫자를 넣어 주세요 (1 이상 정수)");
        if (answer === null) {
          soldOut.checked = true;
          return;
        }
        stock = toNumber(answer);
        if (!Number.isInteger(stock) || stock < 1) {
          soldOut.checked = true;
          showError(new Error("재고는 1 이상 정수여야 합니다: " + answer), result);
          return;
        }
      }
      soldOut.disabled = true;
      try {
        await updateDoc(ref, { stock });
        data.stock = stock;
        stockCell.textContent = String(stock);
        showOk(result, "stock 을 " + stock + " 으로 저장했습니다");
      } catch (error) {
        soldOut.checked = !turnOn;
        showError(error, result);
      }
      soldOut.disabled = false;
    });

    // 노출 토글 - 손님 목록에 보일지 말지
    visible.addEventListener("change", async () => {
      const isVisible = visible.checked;
      visible.disabled = true;
      try {
        await updateDoc(ref, { isVisible });
        data.isVisible = isVisible;
        showOk(result, "isVisible 을 " + isVisible + " 으로 저장했습니다");
      } catch (error) {
        visible.checked = !isVisible;
        showError(error, result);
      }
      visible.disabled = false;
    });

    // 고치기 - 바로 아래 줄에 price · summary · stock 칸을 엽니다
    let editRow = null;
    editBtn.addEventListener("click", () => {
      if (editRow) {
        editRow.remove();
        editRow = null;
        return;
      }
      editRow = table.insertRow(row.rowIndex + 1);
      const cell = editRow.insertCell();
      cell.colSpan = 10;

      const form = document.createElement("form");
      form.className = "pay";
      const fields = {};
      [["price", "number"], ["summary", "text"], ["stock", "number"]].forEach(([key, type]) => {
        const label = document.createElement("label");
        label.textContent = key;
        const input = document.createElement("input");
        input.type = type;
        if (key === "price") input.step = "any";
        if (key === "stock") { input.step = "1"; input.min = "0"; }
        input.value = data[key] == null ? "" : String(data[key]);
        label.append(input);
        form.append(label);
        fields[key] = input;
      });
      // 사진을 고르면 products/문서 ID/main.jpg 에 덮어 올립니다
      const photoLabel = document.createElement("label");
      photoLabel.textContent = "사진";
      const photoInput = document.createElement("input");
      photoInput.type = "file";
      photoInput.accept = "image/*";
      photoLabel.append(photoInput);
      form.append(photoLabel);
      const save = document.createElement("button");
      save.type = "submit";
      save.className = "btn";
      save.textContent = "저장";
      form.append(save);
      cell.append(form);

      form.addEventListener("submit", async event => {
        event.preventDefault();
        // price 와 stock 은 숫자로 저장합니다 - 글자로 저장하지 않습니다
        const price = toNumber(fields.price.value);
        const stock = toNumber(fields.stock.value);
        const summary = fields.summary.value;
        if (price === null) {
          showError(new Error("price 는 숫자여야 합니다: " + fields.price.value), result);
          return;
        }
        if (!isStockNumber(stock)) {
          showError(new Error("stock 은 0 이상 정수여야 합니다: " + fields.stock.value), result);
          return;
        }
        // 사진은 올리기 전에 크기와 종류를 봅니다 - 안 되면 아무것도 저장하지 않고 멈춥니다
        const file = photoInput.files[0];
        const problem = file ? photoProblem(file) : null;
        if (problem) {
          showOk(result, problem);
          return;
        }
        save.disabled = true;
        try {
          await updateDoc(ref, { price, summary, stock });
          Object.assign(data, { price, summary, stock });
          priceCell.textContent = String(price);
          stockCell.textContent = String(stock);
          soldOut.checked = stock === 0;
          showOk(result, "price · summary · stock 을 저장했습니다");
        } catch (error) {
          showError(error, result);
          save.disabled = false;
          return;
        }
        if (file) {
          try {
            await uploadPhoto(id, file, result);
          } catch (error) {
            // 사진 올리기가 실패하면 imagePath 는 적지 않습니다
            showError(error, result);
            save.disabled = false;
            return;
          }
          try {
            // 다 올라간 뒤에 경로 글자만 적습니다
            const path = photoPath(id);
            await updateDoc(ref, { imagePath: path });
            data.imagePath = path;
            paintThumb(thumbCell, path);
            showOk(result, "price · summary · stock 과 사진을 저장했습니다 (imagePath: " + path + ")");
          } catch (error) {
            showError(error, result);
            save.disabled = false;
            return;
          }
        }
        editRow.remove();
        editRow = null;
      });
    });
  }

  /* --- 새 상품 - 문서 ID 는 자동으로 붙이고, 숨긴 채(isVisible: false)로 만듭니다 --- */
  const newForm = document.querySelector("#new-form");
  const newResult = document.querySelector("#new-result");

  document.querySelector("#btn-new").addEventListener("click", () => {
    newForm.hidden = false;
  });
  document.querySelector("#btn-new-close").addEventListener("click", () => {
    newForm.hidden = true;
    newResult.replaceChildren();
  });

  newForm.addEventListener("submit", async event => {
    event.preventDefault();
    const name = document.querySelector("#new-name").value;
    const priceText = document.querySelector("#new-price").value;
    const stockText = document.querySelector("#new-stock").value;
    const summary = document.querySelector("#new-summary").value;
    const price = toNumber(priceText);
    const stock = toNumber(stockText);
    if (price === null) {
      showError(new Error("price 는 숫자여야 합니다: " + priceText), newResult);
      return;
    }
    if (!isStockNumber(stock)) {
      showError(new Error("stock 은 0 이상 정수여야 합니다: " + stockText), newResult);
      return;
    }
    // 사진은 문서를 만들기 전에 크기와 종류를 봅니다 - 안 되면 아무것도 만들지 않고 멈춥니다
    const file = document.querySelector("#new-photo").files[0];
    const problem = file ? photoProblem(file) : null;
    if (problem) {
      showOk(newResult, problem);
      return;
    }
    const saveBtn = newForm.querySelector("button[type=submit]");
    saveBtn.disabled = true;

    // 1) 문서 ID 를 자동으로 붙인 새 문서를 isVisible false 로 만듭니다
    let ref;
    try {
      // createdAt 은 내 컴퓨터 시각이 아니라 서버 시각으로 넣습니다
      ref = await addDoc(productsCol, {
        name,
        price,
        summary,
        stock,
        isVisible: false,
        createdAt: serverTimestamp()
      });
    } catch (error) {
      showError(error, newResult);
      saveBtn.disabled = false;
      return;
    }

    if (file) {
      // 2) 그 문서 ID 로 products/문서 ID/main.jpg 에 사진을 올립니다
      try {
        await uploadPhoto(ref.id, file, newResult);
      } catch (error) {
        // 사진 올리기가 실패하면 imagePath 는 적지 않습니다 (문서는 이미 만들어져 있습니다)
        showError(error, newResult);
        await paintTable();
        saveBtn.disabled = false;
        return;
      }
      // 3) 다 올라간 뒤에 imagePath 에 경로 글자만 적습니다
      try {
        await updateDoc(doc(db, "products", ref.id), { imagePath: photoPath(ref.id) });
      } catch (error) {
        showError(error, newResult);
        await paintTable();
        saveBtn.disabled = false;
        return;
      }
      showOk(newResult, "새 상품을 만들고 사진을 올렸습니다: " + ref.id + " (imagePath: " + photoPath(ref.id) + ")");
    } else {
      showOk(newResult, "새 상품을 만들었습니다: " + ref.id);
    }
    newForm.reset();
    newForm.hidden = true;
    await paintTable();
    saveBtn.disabled = false;
  });

  /* ===========================================================
     주문 탭 - orders 를 createdAt 최신부터 20개씩 읽습니다.
     상태를 고르면 Firestore 에 그 상태만 물어 처음부터 다시 읽습니다 (화면에서 고르지 않습니다).
     이 화면은 status 와 statusUpdatedAt 만 고칩니다. adminLogs 에는 쓰지 않습니다.
     =========================================================== */
  const ordersCol = collection(db, "orders");
  const ordersStatus = document.querySelector("#orders-status");
  const ordersMsg = document.querySelector("#orders-msg");
  const ordersBox = document.querySelector("#orders-table");
  const ordersMore = document.querySelector("#btn-orders-more");
  const orderDetail = document.querySelector("#order-detail");
  const statusDialog = document.querySelector("#status-dialog");

  const PAGE = 20;

  // 지금 상태에서 다음으로 갈 상태와 버튼 글자. delivered · canceled 는 없습니다
  const NEXT = {
    paid: { status: "preparing", label: "포장 시작" },
    preparing: { status: "shipped", label: "배송 시작" },
    shipped: { status: "delivered", label: "배송 완료" }
  };

  // 마지막으로 읽은 문서 - 「더 보기」 는 이 다음부터 읽습니다
  let lastOrder = null;
  // 상태를 바꿔 다시 읽을 때, 늦게 온 앞선 결과를 버리기 위한 번호
  let ordersTurn = 0;
  let detailTurn = 0;

  // 오류는 줄이지 않고 콘솔에 그대로 남기고 (색인 만들기 링크도 그대로), 화면에는 한 줄만 보여 줍니다
  function showOrderError(box, text, error) {
    console.error(error);
    const p = document.createElement("p");
    p.className = "rules-error";
    p.textContent = text + " (" + (error && error.code ? error.code : "오류") + ") - 자세한 글은 브라우저 콘솔에 있습니다";
    box.replaceChildren(p);
  }

  function timeText(t) {
    return t && typeof t.toDate === "function" ? t.toDate().toLocaleString("ko-KR") : "";
  }

  function itemsText(items) {
    if (!Array.isArray(items)) return String(items ?? "");
    return items.map(i => String(i?.id ?? "") + " × " + String(i?.qty ?? "")).join("\n");
  }

  // fresh 가 true 면 처음부터, false 면 마지막으로 읽은 것 다음부터 20개
  async function loadOrders(fresh) {
    const mine = ++ordersTurn;
    const status = ordersStatus.value;
    if (fresh) {
      lastOrder = null;
      ordersBox.replaceChildren();
    }
    ordersMore.hidden = true;
    ordersMsg.textContent = "주문을 읽는 중입니다";

    const parts = [];
    if (status !== "all") parts.push(where("status", "==", status));
    parts.push(orderBy("createdAt", "desc"));
    if (lastOrder) parts.push(startAfter(lastOrder));
    parts.push(limit(PAGE));

    try {
      const snap = await getDocsFromServer(query(ordersCol, ...parts));
      if (mine !== ordersTurn) return;
      let table = ordersBox.querySelector("table");
      if (!table) {
        table = document.createElement("table");
        table.className = "cart";
        const head = table.insertRow();
        ["주문 번호", "금액", "상태", "주문 시각"].forEach(text => {
          const th = document.createElement("th");
          th.textContent = text;
          head.append(th);
        });
        ordersBox.replaceChildren(table);
      }
      snap.forEach(d => addOrderRow(table, d.id, d.data()));
      if (snap.docs.length) lastOrder = snap.docs[snap.docs.length - 1];
      const count = table.rows.length - 1;
      ordersMsg.textContent = count ? "지금 보이는 주문 " + count + "개" : "주문이 없습니다";
      // 꽉 차게 왔으면 더 있을 수 있으므로 「더 보기」 를 둡니다
      ordersMore.hidden = snap.docs.length < PAGE;
    } catch (error) {
      if (mine !== ordersTurn) return;
      ordersMsg.textContent = "";
      showOrderError(ordersBox, "주문을 읽지 못했습니다", error);
      // 「더 보기」 에서 실패했으면 다시 누를 수 있게 둡니다
      ordersMore.hidden = !lastOrder;
    }
  }

  // 주문 한 줄. Firestore 에서 온 값은 글자로만 넣습니다
  function addOrderRow(table, id, data) {
    const row = table.insertRow();
    row.dataset.id = id;
    row.tabIndex = 0;
    [id, String(data.totalPrice ?? ""), String(data.status ?? ""), timeText(data.createdAt)].forEach(text => {
      row.insertCell().textContent = text;
    });
    row.addEventListener("click", () => paintOrderDetail(id));
    row.addEventListener("keydown", event => {
      if (event.key === "Enter") paintOrderDetail(id);
    });
  }

  // 상세 - 누를 때마다 서버에서 그 주문을 새로 읽습니다
  async function paintOrderDetail(id) {
    const mine = ++detailTurn;
    const loading = document.createElement("p");
    loading.textContent = "주문 " + id + " 을 읽는 중입니다";
    orderDetail.replaceChildren(loading);
    orderDetail.scrollIntoView({ block: "nearest" });
    let snap;
    try {
      snap = await getDocFromServer(doc(db, "orders", id));
    } catch (error) {
      if (mine !== detailTurn) return;
      showOrderError(orderDetail, "주문 " + id + " 을 읽지 못했습니다", error);
      return;
    }
    if (mine !== detailTurn) return;
    if (!snap.exists()) {
      showOk(orderDetail, "주문 " + id + " 을 찾지 못했습니다");
      return;
    }
    const data = snap.data();

    const h = document.createElement("h3");
    h.textContent = "주문 " + id;
    const dl = document.createElement("dl");
    const lines = [
      ["주문 번호", id],
      ["산 것", itemsText(data.items)],
      ["금액", String(data.totalPrice ?? "")],
      ["상태", String(data.status ?? "")],
      ["받은 시각", timeText(data.receivedAt)],
      ["처리 표시", String(data.processStatus ?? "")]
    ];
    if (data.processError != null) lines.push(["처리 오류", String(data.processError)]);
    if (data.mailStatus != null) lines.push(["메일 표시", String(data.mailStatus)]);
    if (data.statusUpdatedAt != null) lines.push(["상태를 바꾼 시각", timeText(data.statusUpdatedAt)]);
    lines.forEach(([label, text]) => {
      const dt = document.createElement("dt");
      dt.textContent = label;
      const dd = document.createElement("dd");
      dd.textContent = text;
      dl.append(dt, dd);
    });

    const result = document.createElement("div");
    orderDetail.replaceChildren(h, dl);

    // 지금 상태에서 다음으로 갈 버튼 하나만
    const next = NEXT[data.status];
    if (next) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn";
      btn.textContent = next.label;
      btn.addEventListener("click", () => changeStatus(id, next.status, btn, result));
      orderDetail.append(btn);
    }
    orderDetail.append(result);
  }

  // 확인 창을 띄우고, 누른 버튼 값("change" 또는 "cancel")을 돌려줍니다. Esc 로 닫으면 "" 입니다
  function askStatus(id, status) {
    document.querySelector("#status-text").textContent = "주문 " + id + "를 " + status + "로 바꿉니다";
    statusDialog.returnValue = "";
    statusDialog.showModal();
    return new Promise(resolve => {
      statusDialog.addEventListener("close", () => resolve(statusDialog.returnValue), { once: true });
    });
  }

  async function changeStatus(id, status, btn, result) {
    const answer = await askStatus(id, status);
    if (answer !== "change") return;
    btn.disabled = true;
    try {
      // status 와 statusUpdatedAt 두 필드만 고칩니다. 시각은 내 컴퓨터 시계가 아니라 서버 시각으로
      await updateDoc(doc(db, "orders", id), { status, statusUpdatedAt: serverTimestamp() });
    } catch (error) {
      btn.disabled = false;
      showOrderError(result, "상태를 바꾸지 못했습니다", error);
      return;
    }
    // 목록 줄의 상태 칸도 맞춰 둡니다
    const row = ordersBox.querySelector('tr[data-id="' + CSS.escape(id) + '"]');
    if (row) row.cells[2].textContent = status;
    // 상세를 새로 불러와 새 상태와 다음 버튼을 보여 줍니다
    await paintOrderDetail(id);
  }

  ordersStatus.addEventListener("change", () => {
    orderDetail.replaceChildren();
    loadOrders(true);
  });
  ordersMore.addEventListener("click", () => loadOrders(false));

  /* ===========================================================
     매출 탭 - 함수(countDailyOrders)가 매일 00:05 에 적는 dailyStats 만 읽습니다.
     어제(서울 날짜)부터 거꾸로 7일, 날짜마다 문서 한 장씩. 오늘 숫자를 주문에서 세지 않습니다.
     =========================================================== */
  const salesLead = document.querySelector("#sales-lead");
  const salesCounted = document.querySelector("#sales-counted");
  const salesMsg = document.querySelector("#sales-msg");
  const salesTable = document.querySelector("#sales-table");
  let salesChart = null;

  // 어제(서울 날짜)부터 거꾸로 7일의 문서 이름 - 오래된 날이 앞. 함수와 같은 방식(UTC+9)으로 셉니다
  function lastSevenDays() {
    const nowSeoul = new Date(Date.now() + 9 * 60 * 60 * 1000);
    const y = nowSeoul.getUTCFullYear();
    const m = nowSeoul.getUTCMonth();
    const d = nowSeoul.getUTCDate();
    const ids = [];
    for (let back = 7; back >= 1; back--) {
      const day = new Date(Date.UTC(y, m, d - back));
      ids.push(String(day.getUTCFullYear()) + String(day.getUTCMonth() + 1).padStart(2, "0") + String(day.getUTCDate()).padStart(2, "0"));
    }
    return ids;
  }

  // 20261028 → 2026-10-28
  const dayText = id => id.slice(0, 4) + "-" + id.slice(4, 6) + "-" + id.slice(6, 8);

  async function loadSales() {
    salesMsg.textContent = "매출을 읽는 중입니다";
    salesLead.textContent = "";
    salesCounted.textContent = "";
    salesTable.replaceChildren();

    const ids = lastSevenDays();
    let days;
    try {
      const snaps = await Promise.all(ids.map(id => getDocFromServer(doc(db, "dailyStats", id))));
      days = ids.map((id, i) => ({ id, data: snaps[i].exists() ? snaps[i].data() : null }));
    } catch (error) {
      showOrderError(salesMsg, "매출을 읽지 못했습니다", error);
      return;
    }
    salesMsg.textContent = "";

    // 가장 최근 문서 - 뒤에서부터 찾습니다
    const latest = [...days].reverse().find(d => d.data);
    if (latest) {
      salesLead.textContent = dayText(latest.id) + "까지의 매출입니다 - 매일 00:05에 전날을 셉니다";
      salesCounted.textContent = "마지막으로 센 시각: " + timeText(latest.data.countedAt);
    } else {
      salesLead.textContent = "최근 7일 집계 문서가 없습니다 - 매일 00:05에 전날을 셉니다";
    }

    // 표 - 날짜 · 건수 · 매출 · 센 시각 (canceledCount 가 있는 날이 있으면 칸을 하나 더 둡니다)
    const hasCanceled = days.some(d => d.data && d.data.canceledCount != null);
    const table = document.createElement("table");
    table.className = "cart";
    const head = table.insertRow();
    ["날짜", "건수", "매출", "센 시각"].concat(hasCanceled ? ["취소 건수"] : []).forEach(text => {
      const th = document.createElement("th");
      th.textContent = text;
      head.append(th);
    });
    days.forEach(({ id, data }) => {
      const row = table.insertRow();
      row.insertCell().textContent = dayText(id);
      if (!data) {
        const cell = row.insertCell();
        cell.colSpan = hasCanceled ? 4 : 3;
        cell.textContent = "집계 없음";
        return;
      }
      // Firestore 에서 온 값은 글자로만 넣습니다
      [String(data.orderCount ?? ""), String(data.totalSales ?? ""), timeText(data.countedAt)]
        .concat(hasCanceled ? [String(data.canceledCount ?? "")] : [])
        .forEach(text => { row.insertCell().textContent = text; });
    });
    salesTable.replaceChildren(table);

    // 막대 차트 - 문서가 없는 날은 null 로 두어 막대를 그리지 않고, 날짜 아래에 「집계 없음」
    try {
      if (typeof window.Chart !== "function") throw new Error("Chart.js 를 불러오지 못했습니다");
      if (salesChart) salesChart.destroy();
      salesChart = new window.Chart(document.querySelector("#sales-chart"), {
        type: "bar",
        data: {
          labels: days.map(d => (d.data ? dayText(d.id) : [dayText(d.id), "집계 없음"])),
          datasets: [{
            label: "매출 (totalSales)",
            data: days.map(d => (d.data && typeof d.data.totalSales === "number" ? d.data.totalSales : null))
          }]
        },
        options: {
          maintainAspectRatio: false,
          scales: { y: { beginAtZero: true } }
        }
      });
    } catch (error) {
      showOrderError(salesMsg, "차트를 그리지 못했습니다", error);
    }
  }
</script>
</body>
