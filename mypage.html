<header class="site"><div class="wrap">
  <a class="brand" href="index.html">유라문구</a>
  <nav class="site">
    <a href="index.html">문구</a>
    <a href="about.html">가게 이야기</a>
    <a href="shipping.html">배송과 교환</a>
    <a href="cart.html">장바구니<span class="cart-count">0</span></a>
    <span class="auth-nav" id="auth-nav" hidden></span>
  </nav>
</div></header>

<main><div class="wrap">

  <!-- 로그인했는지 확인이 끝날 때까지는 이 줄만 보입니다 -->
  <p class="lead" id="mypage-checking">로그인했는지 확인하고 있습니다.</p>

  <!-- 확인이 끝나고, 로그인한 사람일 때만 hidden 이 풀립니다.
       hidden 을 처음부터 달아 두었으므로 확인 전에는 내용이 비치지 않습니다. -->
  <div id="mypage-body" hidden>
    <h2>마이페이지</h2>
    <p class="lead">지금 이 브라우저로 들어와 있는 계정입니다.</p>

    <div class="panel">
      <p class="panel-label">이메일</p>
      <p class="panel-value" id="mypage-email"></p>
      <button class="btn ghost" type="button" id="mypage-logout">로그아웃</button>
    </div>
  </div>

</div></main>

<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script type="module" src="assets/auth.js"></script>

<script type="module">
  // 로그인 상태를 묻는 자리는 assets/auth.js 한 곳뿐입니다. 여기서는 결과만 받아 씁니다.
  import { requireUser, logout } from "./assets/auth.js";

  const checking = document.querySelector("#mypage-checking");
  const body = document.querySelector("#mypage-body");
  const emailLine = document.querySelector("#mypage-email");

  // 로그인하지 않았으면 auth.js 가 login.html?next=mypage.html 로 보냅니다.
  // 로그인했을 때만 이 안이 돌아갑니다.
  requireUser(user => {
    // 이메일은 글자로만 넣습니다
    emailLine.textContent = user.email || "(이메일이 없는 계정입니다)";
    checking.hidden = true;
    body.hidden = false;
  });

  document.querySelector("#mypage-logout").addEventListener("click", () => {
    logout().catch(error => {
      checking.hidden = false;
      checking.textContent = error && error.code ? error.code : String(error);
    });
  });
</script>
</body>
</html>
