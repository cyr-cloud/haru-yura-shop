<head>
<meta charset="utf-8">

<header class="site"><div class="wrap">
  <a class="brand" href="index.html">유라문구</a>
  <nav class="site">
    <a href="index.html">문구</a>
    <a href="about.html">가게 이야기</a>
    <a href="shipping.html">배송과 교환</a>
    <a href="cart.html">장바구니<span class="cart-count">0</span></a>
    <span class="auth-nav" id="auth-nav" hidden></span>
  </nav>
</div></header>

<main><div class="wrap">

  <!-- 로그인했는지 확인이 끝날 때까지는 이 줄만 보입니다 -->
  <p class="lead" id="mypage-checking">로그인했는지 확인하고 있습니다.</p>

  <!-- 확인이 끝나고, 로그인한 사람일 때만 hidden 이 풀립니다.
       hidden 을 처음부터 달아 두었으므로 확인 전에는 내용이 비치지 않습니다. -->
  <div id="mypage-body" hidden>
    <h2>마이페이지</h2>
    <p class="lead">지금 이 브라우저로 들어와 있는 계정입니다.</p>

    <div class="panel">
      <p class="panel-label">이메일</p>
      <p class="panel-value" id="mypage-email"></p>

      <!-- 인증이 아직 안 끝난 계정에게만 보이는 안내 한 줄과 단추 하나입니다.
           인증된 계정이면 둘 다 숨은 채로 남습니다. -->
      <p class="verify-note" id="verify-note" role="status" aria-live="polite" hidden></p>
      <button class="btn ghost" type="button" id="btn-resend" hidden>인증 메일 다시 보내기</button>

      <button class="btn ghost" type="button" id="mypage-logout">로그아웃</button>
    </div>
  </div>

</div></main>

<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script type="module" src="assets/auth.js"></script>

<script type="module">
  // 로그인 상태를 묻는 자리는 assets/auth.js 한 곳뿐입니다. 여기서는 결과만 받아 씁니다.
  import { auth, requireUser, logout, sendVerifyMail, mailErrorLine } from "./assets/auth.js";

  const checking = document.querySelector("#mypage-checking");
  const body = document.querySelector("#mypage-body");
  const emailLine = document.querySelector("#mypage-email");
  const note = document.querySelector("#verify-note");
  const resendBtn = document.querySelector("#btn-resend");

  // 인증이 아직 안 끝난 계정에게 보여 줄 안내 한 줄
  const NOT_VERIFIED = "이 계정은 메일 인증이 아직 끝나지 않았습니다. 메일함과 스팸함을 확인해 주세요.";

  // 인증됐으면 안내와 단추를 둘 다 숨기고, 안 됐으면 둘 다 보여 줍니다
  function paintVerify(verified) {
    if (verified) {
      note.hidden = true;
      resendBtn.hidden = true;
      return;
    }
    note.textContent = NOT_VERIFIED;
    note.hidden = false;
    resendBtn.hidden = false;
  }

  // 로그인하지 않았으면 auth.js 가 login.html?next=mypage.html 로 보냅니다.
  // 로그인했을 때만 이 안이 돌아갑니다. 인증 여부로는 막지 않습니다.
  requireUser(async user => {
    // 이메일은 글자로만 넣습니다
    emailLine.textContent = user.email || "(이메일이 없는 계정입니다)";

    // 이 화면을 열 때마다 인증 여부를 Firebase 에서 새로 받아 옵니다.
    // 메일함에서 인증을 누르고 돌아온 경우에도 바로 맞게 보입니다.
    try {
      await user.reload();
    } catch (error) {
      /* 새로 못 받아 왔으면 지금 알고 있는 값으로 그립니다 */
    }
    paintVerify((auth.currentUser || user).emailVerified);

    checking.hidden = true;
    body.hidden = false;
  });

  resendBtn.addEventListener("click", async () => {
    const user = auth.currentUser;
    if (!user) return;

    resendBtn.disabled = true;
    note.hidden = false;
    note.textContent = "인증 메일을 다시 보내는 중입니다";
    try {
      await sendVerifyMail(user);
      note.textContent = "인증 메일을 다시 보냈습니다. 메일함과 스팸함을 확인해 주세요.";
    } catch (error) {
      // 너무 자주 눌러 auth/too-many-requests 가 오면 우리 말 한 줄로 바뀝니다
      note.textContent = mailErrorLine(error);
    }
    resendBtn.disabled = false;
  });

  document.querySelector("#mypage-logout").addEventListener("click", () => {
    logout().catch(error => {
      checking.hidden = false;
      checking.textContent = error && error.code ? error.code : String(error);
    });
  });
</script>
</body>
</html>
